name: ci

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest }
          - { name: macos-arm64, os: macos-latest }
          - { name: windows-x86_64, os: windows-latest }
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 (gcc)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc diffutils

      - name: Bootstrap and test (unix)
        if: runner.os != 'Windows'
        run: |
          scripts/bootstrap.sh
          test/run_tests.sh
          test/selfhost.sh

      - name: Bootstrap and test (windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          export NOVUS_CC=gcc
          scripts/bootstrap.sh
          test/run_tests.sh
          test/selfhost.sh

      - name: Package
        shell: bash
        run: |
          mkdir -p artifact
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp build/novusc.exe artifact/novusc-${{ matrix.name }}.exe
          else
            cp build/novusc artifact/novusc-${{ matrix.name }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: novusc-${{ matrix.name }}
          path: artifact/*

  lsp:
    name: novus-lsp (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest }
          - { name: macos-arm64, os: macos-latest }
    defaults:
      run:
        working-directory: novus
    steps:
      - uses: actions/checkout@v4
        with:
          path: novus

      - name: Bootstrap
        run: scripts/bootstrap.sh

      # the corpus counts the generated website/content/**/*.nvh as well (fetches the website's two dependencies)
      - name: Generate website content
        run: make -C website content NOVUSC=../build/novusc

      - name: Build novus-lsp
        run: make lsp

      - name: Structure lint
        run: scripts/lsp_lint.sh

      - name: Golden cases
        run: test/run_tests.sh lsp_

      - name: Protocol scenarios
        run: test/run_lsp.sh

      # the golden counters expect the whole corpus to be fuzzed, which a CI runner needs more time for
      - name: Corpus
        env:
          FUZZ_TOOL_CAP_SECONDS: 900
          CORPUS_FUZZ_TIMEOUT: 1200
        run: test/run_lsp_corpus.sh

      - name: Snippets
        run: scripts/lsp_snippets.sh

      - name: Package
        run: |
          mkdir -p artifact
          cp build/novus-lsp artifact/novus-lsp-${{ matrix.name }}

      - uses: actions/upload-artifact@v4
        with:
          name: novus-lsp-${{ matrix.name }}
          path: novus/artifact/*

  website:
    name: docs site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: novus
    steps:
      - uses: actions/checkout@v4
        with:
          path: novus
      # the site itself needs only novusc and website/; it fetches nvh-markdown and nvh-tailwindcss by itself
      - name: Bootstrap
        run: scripts/bootstrap.sh
      - name: Build, export and link check
        run: make -C website export NOVUSC=../build/novusc
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: novus/website/dist

  cross:
    name: cross (zig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - name: Bootstrap
        run: scripts/bootstrap.sh
      - name: Cross compile (novusc and novus-lsp)
        run: scripts/cross.sh
      - uses: actions/upload-artifact@v4
        with:
          name: novusc-cross
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native, lsp, cross]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # the compiler and language server binaries (novusc-*, novus-lsp-*); docs-site is not a release asset
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: novus*
      - name: Collect
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          # tags like v0.1.0-pre.alpha.8 become GitHub pre-releases
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
